<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Copa Companion — Organizer Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800&family=Archivo+Black&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a1420; --bg2: #0e1c2e; --panel: rgba(255, 255, 255, .045);
    --panel-border: rgba(255, 255, 255, .09); --field: #16283d;
    --text: #eef4fa; --muted: #9db2c8;
    --green: #34d97b; --green-deep: #14b85c; --gold: #f4c542; --red: #ff6b52;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; color: var(--text); line-height: 1.5;
    font-family: "Archivo", system-ui, sans-serif;
    background:
      radial-gradient(1100px 500px at 80% -10%, rgba(255, 107, 82, .10), transparent 60%),
      radial-gradient(900px 500px at -10% 30%, rgba(37, 99, 235, .16), transparent 55%),
      linear-gradient(180deg, var(--bg2), var(--bg) 40%);
    min-height: 100vh;
  }
  header {
    max-width: 1080px; margin: 0 auto; padding: 1.8rem 1.25rem .8rem;
    display: flex; align-items: baseline; gap: .9rem; flex-wrap: wrap;
  }
  header h1 { margin: 0; font-family: "Archivo Black", "Archivo", sans-serif; font-size: clamp(1.3rem, 3.5vw, 1.7rem); }
  header .sub { color: var(--muted); font-size: .85rem; }
  header a { margin-left: auto; color: var(--green); font-size: .85rem; }
  main { max-width: 1080px; margin: 0 auto; padding: .4rem 1.25rem 2rem; display: grid; gap: 1rem; grid-template-columns: 1fr 1fr; }
  section {
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 16px; padding: 1.1rem 1.2rem; backdrop-filter: blur(8px);
  }
  .wide { grid-column: 1 / -1; }
  h2 { font-size: .95rem; margin: 0 0 .8rem; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; } }

  #gates { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: .6rem; }
  .gate { background: var(--field); border: 1px solid var(--panel-border); border-radius: 12px; padding: .75rem .85rem; }
  .gate .top { display: flex; justify-content: space-between; align-items: baseline; }
  .gate .name { font-weight: 800; letter-spacing: .04em; }
  .gate .trend { font-size: .78rem; font-weight: 600; }
  .gate .wait { font-size: 1.7rem; font-weight: 800; line-height: 1.2; }
  .gate .wait small { font-size: .7rem; font-weight: 500; }
  .gate .meta { font-size: .74rem; color: var(--muted); }
  .gate.ok .wait, .gate.ok .trend { color: var(--green); }
  .gate.warn .wait, .gate.warn .trend { color: var(--gold); }
  .gate.alert .wait, .gate.alert .trend { color: var(--red); }
  .gate.alert { border-color: rgba(255, 107, 82, .5); }

  #briefing {
    font-size: .95rem; background: var(--field); border: 1px solid var(--panel-border);
    border-radius: 12px; padding: .9rem 1rem; min-height: 3.4em; white-space: pre-wrap;
  }
  button {
    font: inherit; border: none; border-radius: 10px; padding: .5rem .9rem; cursor: pointer;
    background: linear-gradient(135deg, var(--green), var(--green-deep)); color: #06240f; font-weight: 700;
    transition: filter .2s;
  }
  button:hover { filter: brightness(1.08); }
  button:focus-visible { outline: 3px solid var(--green); outline-offset: 2px; }
  .bar { display: flex; align-items: center; gap: .7rem; margin-bottom: .7rem; }
  .bar .stamp { font-size: .75rem; color: var(--muted); }

  #alerts { list-style: none; margin: 0; padding: 0; font-size: .9rem; }
  #alerts li { padding: .55rem .8rem; border-radius: 10px; margin-bottom: .45rem; background: rgba(255, 107, 82, .12); border: 1px solid rgba(255, 107, 82, .4); }
  #alerts li.none { background: rgba(52, 217, 123, .1); border-color: rgba(52, 217, 123, .35); }

  table { width: 100%; border-collapse: collapse; font-size: .88rem; }
  th, td { text-align: left; padding: .5rem .6rem; border-bottom: 1px solid var(--panel-border); }
  th { color: var(--muted); font-size: .75rem; text-transform: uppercase; letter-spacing: .05em; }
  td .hold { font-weight: 700; color: var(--gold); }
  footer { text-align: center; color: #64788d; font-size: .75rem; padding: 0 1rem 2rem; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header>
  <h1>Organizer Dashboard</h1>
  <span class="sub">AT&amp;T Stadium · live crowd operations</span>
  <a href="/">← Fan app</a>
</header>
<main>
  <section class="wide" aria-labelledby="gates-h">
    <h2 id="gates-h">Gate status</h2>
    <div id="gates" role="list" aria-label="Per-gate queue status"></div>
  </section>

  <section class="wide" aria-labelledby="brief-h">
    <h2 id="brief-h">AI ops briefing</h2>
    <div class="bar">
      <button id="brief-btn" type="button">Refresh briefing</button>
      <span class="stamp" id="brief-stamp" role="status"></span>
    </div>
    <div id="briefing" aria-live="polite">Loading…</div>
  </section>

  <section aria-labelledby="alerts-h">
    <h2 id="alerts-h">Alerts</h2>
    <ul id="alerts"></ul>
  </section>

  <section aria-labelledby="exit-h">
    <h2 id="exit-h">Post-match exit plan</h2>
    <table aria-describedby="exit-h">
      <thead><tr><th>Level</th><th>Hold</th><th>Route to</th></tr></thead>
      <tbody id="exit-rows"></tbody>
    </table>
  </section>
</main>
<footer>Data refreshes every 15 s · demo feed is simulated · not affiliated with FIFA</footer>

<script>
  const $ = (id) => document.getElementById(id);
  const ARROW = { rising: "▲ rising", falling: "▼ falling", steady: "▶ steady" };

  async function refresh() {
    const res = await fetch("/api/ops");
    if (!res.ok) return;
    const data = await res.json();

    $("gates").replaceChildren(...data.gates.map((g) => {
      const cls = g.wait_min >= 30 ? "alert" : g.wait_min >= 15 ? "warn" : "ok";
      const div = document.createElement("div");
      div.className = "gate " + cls;
      div.setAttribute("role", "listitem");
      div.setAttribute("aria-label",
        `Gate ${g.gate}: ${g.wait_min} minute wait, ${g.trend}, load ${g.load} times normal`);
      div.innerHTML = `
        <div class="top"><span class="name">GATE ${g.gate}</span>
          <span class="trend">${ARROW[g.trend]}</span></div>
        <div class="wait">${g.wait_min}<small> min</small></div>
        <div class="meta">${g.load}× normal · ${g.location}</div>`;
      return div;
    }));

    const ul = $("alerts");
    if (data.alerts.length) {
      ul.replaceChildren(...data.alerts.map((id) => {
        const g = data.gates.find((x) => x.gate === id);
        const li = document.createElement("li");
        li.textContent = `Gate ${id} over threshold — ${g.wait_min} min (${g.load}× normal, ${g.trend})`;
        return li;
      }));
    } else {
      const li = document.createElement("li");
      li.className = "none";
      li.textContent = "No active alerts — all gates within normal range.";
      ul.replaceChildren(li);
    }

    $("exit-rows").replaceChildren(...data.exit_plan.map((p) => {
      const tr = document.createElement("tr");
      tr.innerHTML = `<td>${p.level}</td><td class="hold">${p.hold_min ? "+" + p.hold_min + " min" : "release now"}</td><td>${p.route}</td>`;
      return tr;
    }));
  }

  async function briefing() {
    $("brief-stamp").textContent = "generating…";
    try {
      const res = await fetch("/api/ops/briefing");
      $("briefing").textContent = (await res.json()).briefing;
      $("brief-stamp").textContent = "updated " + new Date().toLocaleTimeString();
    } catch {
      $("brief-stamp").textContent = "failed — try again";
    }
  }

  $("brief-btn").addEventListener("click", briefing);
  refresh();
  briefing();
  setInterval(refresh, 15000);
</script>
</body>
</html>
